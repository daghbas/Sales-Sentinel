name: Restore Full Source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[restored]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Verify and extract complete project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, binascii, hashlib, pathlib, re
          output = pathlib.Path('/tmp/project.tar.gz')
          with output.open('wb') as destination:
              for chunk in sorted(pathlib.Path('bootstrap').glob('chunk-*.b64')):
                  raw = chunk.read_bytes()
                  cleaned = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
                  cleaned += b'=' * (-len(cleaned) % 4)
                  try:
                      decoded = base64.b64decode(cleaned, validate=False)
                  except binascii.Error as error:
                      raise SystemExit(f'{chunk}: {error}')
                  print(f'{chunk}: encoded={len(cleaned)} decoded={len(decoded)}')
                  destination.write(decoded)
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          expected = '9ddd6156a366605607adc713135c0fc8491f9c9c653d4bfd70cf662360cec3cf'
          print('archive_sha256=', digest)
          if digest != expected:
              raise SystemExit(f'Archive checksum mismatch: {digest} != {expected}')
          PY
          mkdir -p /tmp/project
          tar -xzf /tmp/project.tar.gz -C /tmp/project
          rsync -a --delete --exclude='.git/' /tmp/project/ ./
      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore complete unpacked Sales Sentinel source [restored]"
          if [ -n "${{ github.head_ref }}" ]; then
            git push origin "HEAD:${{ github.head_ref }}"
          else
            git push
          fi
