name: Test, Build and Capture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || (!contains(github.event.head_commit.message || '', '[generated]') && !contains(github.event.head_commit.message || '', '[screenshots]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the official licensed Redsea source
        run: |
          set -euo pipefail
          mkdir -p data/raw /tmp/redsea
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
          node scripts/download_mendeley.mjs
          test -s data/raw/Redsea-Dataset.zip
          unzip -o data/raw/Redsea-Dataset.zip -d /tmp/redsea
          SOURCE_FILE="$(find /tmp/redsea -type f -iname 'RedSea_Data_Cleaned.xlsx' -print -quit)"
          test -n "$SOURCE_FILE"
          cp "$SOURCE_FILE" data/raw/RedSea_Data_Cleaned.xlsx
          echo 'dd994d25042e54119babe058820b02e00b3443fe18150b9213f9c6929466a645  data/raw/RedSea_Data_Cleaned.xlsx' | sha256sum --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-training.txt

      - name: Produce the verified UTF-8 CSV
        run: |
          python - <<'PY'
          import pandas as pd
          frame = pd.read_excel('data/raw/RedSea_Data_Cleaned.xlsx', engine='openpyxl')
          frame.to_csv('data/raw/RedSea_Data_Cleaned.csv', index=False, encoding='utf-8-sig')
          PY
          echo 'c0e8c57748e18d6da0a7cf83909f85043946aa257c8799b151595120f5d7fb66  data/raw/RedSea_Data_Cleaned.csv' | sha256sum --check

      - name: Rebuild real database and model
        run: python scripts/build_from_redsea.py

      - name: Verify generated data
        run: |
          python - <<'PY'
          import json, sqlite3
          manifest=json.load(open('data/source_manifest.json',encoding='utf-8'))
          assert manifest['accepted_rows']==2695
          assert manifest['exact_duplicates_removed']==5
          assert manifest['is_synthetic'] is False
          assert manifest['sama_weekly_used_for_training'] is False
          db=sqlite3.connect('instance/sales_sentinel.db')
          assert db.execute('select count(*) from sales').fetchone()[0]==2695
          assert db.execute('select count(*) from forecasts').fetchone()[0]==37
          PY

      - name: Verify Alembic from an empty database
        run: |
          rm -f /tmp/sales-sentinel-migration.db
          DATABASE_URL=sqlite:////tmp/sales-sentinel-migration.db alembic upgrade head
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('/tmp/sales-sentinel-migration.db')
          tables={row[0] for row in db.execute("select name from sqlite_master where type='table'")}
          assert {'users','sales','model_runs','forecasts','alerts','audit_logs'} <= tables
          PY

      - name: Run tests
        run: pytest -q

      - name: Install Python Playwright browser
        run: python -m playwright install chromium

      - name: Start application
        env:
          SECRET_KEY: github-actions-test-secret
          SESSION_COOKIE_SECURE: '0'
        run: |
          nohup python run.py >/tmp/sales-sentinel.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:5000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/healthz

      - name: Capture live screenshots
        run: python scripts/capture_screenshots.py

      - name: Commit verified data, database and live evidence
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/raw data/processed data/source_manifest.json instance/sales_sentinel.db models reports/model_metrics.json screenshots
          if git diff --cached --quiet; then
            echo 'Generated files unchanged'
          else
            git commit -m 'build: add verified daily data database and live screenshots [generated]'
            git push
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-live-evidence
          path: |
            screenshots/*.png
            data/source_manifest.json
            reports/model_metrics.json
            /tmp/sales-sentinel.log
