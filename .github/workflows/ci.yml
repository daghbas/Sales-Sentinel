name: Test, Build and Capture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || (!contains(github.event.head_commit.message || '', '[generated]') && !contains(github.event.head_commit.message || '', '[screenshots]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore and verify the licensed Redsea daily dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw /tmp/redsea
          if [ -s data/raw/RedSea_Data_Cleaned.csv ]; then
            echo 'Using the verified CSV already committed to the repository.'
          else
            test -d data/bootstrap/redsea-csv-gz
            echo 'c0f2ae8272b54ce6783cd19db34fd855d284929d58d953c29d5b8e6c332834db  data/bootstrap/redsea-csv-gz/part-00.b64' | sha256sum --check
            echo '43f3f32e2b1a63b1aa9ea8e010eb3a0ba8074550d207f51f49990259cac78cec  data/bootstrap/redsea-csv-gz/part-01.b64' | sha256sum --check
            echo 'd05f29467f33471071b1bbc1fdffa4a6d125989a988fcd181cd73f9ff9c23a3a  data/bootstrap/redsea-csv-gz/fix-02-00.b64' | sha256sum --check
            echo 'd5f2c3793a2bb0f460659a42c60303dda075f511f4492551b49957cf1fec8a75  data/bootstrap/redsea-csv-gz/fix-02-01.b64' | sha256sum --check
            echo '99b0051f531bee358a0c902302bf164d97206529d798b5a30caa41dba85bdd14  data/bootstrap/redsea-csv-gz/fix-02-02.b64' | sha256sum --check
            echo 'ca7da8b5417ec5dda76912d8e80d8a1c6e92d92551178eae02ed9f78e8b1b250  data/bootstrap/redsea-csv-gz/fix-02-03.b64' | sha256sum --check
            echo 'a397efb34999a92859b80142f9955244b1c98770d46a391609cc48635e26a769  data/bootstrap/redsea-csv-gz/part-03.b64' | sha256sum --check
            echo '4b4a72fc4ce17f72c54855c2de69cead694dca8796076a1da3c9a6b83128cfa0  data/bootstrap/redsea-csv-gz/part-04.b64' | sha256sum --check
            echo '37ceb478dcd0cf94dd606611cefa56b716223967a5accbc16b0a8e5f8f68dfb2  data/bootstrap/redsea-csv-gz/part-05.b64' | sha256sum --check
            echo 'd93f9d25bf6f6db86e1772d39890a0eb182fb3320c4f0b2245919353e440046f  data/bootstrap/redsea-csv-gz/part-06.b64' | sha256sum --check
            echo 'f6c634ad84f428b9e496af3127cb5ea67dd4c1c9edfa710b9be027e8b7d6af3f  data/bootstrap/redsea-csv-gz/part-07.b64' | sha256sum --check
            cat \
              data/bootstrap/redsea-csv-gz/part-00.b64 \
              data/bootstrap/redsea-csv-gz/part-01.b64 \
              data/bootstrap/redsea-csv-gz/fix-02-00.b64 \
              data/bootstrap/redsea-csv-gz/fix-02-01.b64 \
              data/bootstrap/redsea-csv-gz/fix-02-02.b64 \
              data/bootstrap/redsea-csv-gz/fix-02-03.b64 \
              data/bootstrap/redsea-csv-gz/part-03.b64 \
              data/bootstrap/redsea-csv-gz/part-04.b64 \
              data/bootstrap/redsea-csv-gz/part-05.b64 \
              data/bootstrap/redsea-csv-gz/part-06.b64 \
              data/bootstrap/redsea-csv-gz/part-07.b64 \
              > /tmp/redsea/RedSea_Data_Cleaned.csv.gz.b64
            base64 --decode /tmp/redsea/RedSea_Data_Cleaned.csv.gz.b64 > /tmp/redsea/RedSea_Data_Cleaned.csv.gz
            echo '59761a774894a7de568849756ccf1d74a354989e05ae238df3bb0eb36899fc65  /tmp/redsea/RedSea_Data_Cleaned.csv.gz' | sha256sum --check
            gzip -dc /tmp/redsea/RedSea_Data_Cleaned.csv.gz > data/raw/RedSea_Data_Cleaned.csv
          fi
          echo 'c0e8c57748e18d6da0a7cf83909f85043946aa257c8799b151595120f5d7fb66  data/raw/RedSea_Data_Cleaned.csv' | sha256sum --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-training.txt

      - name: Rebuild real database and model
        run: python scripts/build_from_redsea.py

      - name: Verify generated data
        run: |
          python - <<'PY'
          import json, sqlite3
          manifest=json.load(open('data/source_manifest.json',encoding='utf-8'))
          assert manifest['accepted_rows']==2695
          assert manifest['exact_duplicates_removed']==5
          assert manifest['is_synthetic'] is False
          assert manifest['sama_weekly_used_for_training'] is False
          db=sqlite3.connect('instance/sales_sentinel.db')
          assert db.execute('select count(*) from sales').fetchone()[0]==2695
          assert db.execute('select count(*) from forecasts').fetchone()[0]==37
          PY

      - name: Verify Alembic from an empty database
        run: |
          rm -f /tmp/sales-sentinel-migration.db
          DATABASE_URL=sqlite:////tmp/sales-sentinel-migration.db alembic upgrade head
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('/tmp/sales-sentinel-migration.db')
          tables={row[0] for row in db.execute("select name from sqlite_master where type='table'")}
          assert {'users','sales','model_runs','forecasts','alerts','audit_logs'} <= tables
          PY

      - name: Run tests with diagnostic log
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest tests/test_app.py -x -vv --tb=long 2>&1 | tee /tmp/pytest.log

      - name: Install Chromium
        if: steps.pytest.outcome == 'success'
        run: python -m playwright install --with-deps chromium

      - name: Start application
        if: steps.pytest.outcome == 'success'
        env:
          SECRET_KEY: github-actions-test-secret
          SESSION_COOKIE_SECURE: '0'
        run: |
          nohup python run.py >/tmp/sales-sentinel.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:5000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/healthz

      - name: Capture live screenshots
        if: steps.pytest.outcome == 'success'
        run: python scripts/capture_screenshots.py

      - name: Commit verified data, database and live evidence
        if: github.event_name == 'push' && steps.pytest.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/raw data/processed data/source_manifest.json instance/sales_sentinel.db models reports/model_metrics.json screenshots
          if git diff --cached --quiet; then
            echo 'Generated files unchanged'
          else
            git commit -m 'build: add verified daily data database and live screenshots [generated]'
            git push
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-live-evidence
          path: |
            screenshots/*.png
            data/source_manifest.json
            reports/model_metrics.json
            /tmp/sales-sentinel.log
            /tmp/pytest.log

      - name: Enforce test result
        if: steps.pytest.outcome == 'failure'
        run: exit 1
